name: CD
on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types:
      - completed
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      run: |
        docker build -t ${{ github.sha }} .
        docker tag ${{ github.sha }} ${{ secrets.DEPLOY_HOST }}/${{ github.sha }}
        docker push ${{ secrets.DEPLOY_HOST }}/${{ github.sha }}
    - name: Deploy
      run: |
        # Deploy command not specified in the project
    - name: Health check
      run: |
        # Health check command not specified in the project
